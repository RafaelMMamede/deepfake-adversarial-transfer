name: Release smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            attacks \
            preprocessing/scripts \
            pretraining \
            training \
            analysis/tools \
            analysis/transfer_analysis_node_jackknife.py

      - name: Validate release metadata and manifests
        run: |
          python - <<'PY'
          import ast
          import csv
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          import zipfile

          import yaml

          root = pathlib.Path(".")

          # JSON and YAML syntax.
          for path in root.rglob("*.json"):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          for pattern in ("*.yaml", "*.yml"):
              for path in root.rglob(pattern):
                  with path.open("r", encoding="utf-8") as f:
                      yaml.safe_load(f)

          # The exact training/attack environment is Python 3.7. Reject syntax
          # that could only parse on newer Python versions.
          for path in root.rglob("*.py"):
              source = path.read_text(encoding="utf-8")
              ast.parse(source, filename=str(path), feature_version=(3, 7))

          # Verify the single bundled third-party binary.
          wheel = pathlib.Path("wheels/autoattack-0.1-py3-none-any.whl")
          expected_sha256 = "f5a3e2641abfca1af0b4548d11f2e3e0a00d11df9c07ae8c9de054dccb56e6ac"
          actual_sha256 = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert actual_sha256 == expected_sha256, (
              f"AutoAttack wheel checksum mismatch: {actual_sha256}"
          )
          with zipfile.ZipFile(wheel) as zf:
              assert any(
                  pathlib.PurePosixPath(name).name == "LICENSE"
                  for name in zf.namelist()
              ), "Bundled AutoAttack wheel does not contain its upstream LICENSE"

          # Citation metadata is YAML and should expose the expected essentials.
          citation = yaml.safe_load(pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          assert citation["cff-version"] == "1.2.0"
          assert citation["license"] == "CC-BY-NC-4.0"
          assert citation["preferred-citation"]["year"] == 2026

          # Detector manifest: 6 architectures x 2 pretraining regimes x 5 train families.
          models = json.loads(pathlib.Path("attacks/models_to_eval.json").read_text(encoding="utf-8"))
          assert len(models) == 60, f"Expected 60 models, found {len(models)}"
          names = [m["name"] for m in models]
          assert len(names) == len(set(names)), "Duplicate detector names in models_to_eval.json"
          for model in models:
              config = pathlib.Path(model["config"].removeprefix("./"))
              assert config.is_file(), f"Missing config for {model['name']}: {config}"
              ckpt = model["ckpt"]
              assert ckpt.startswith("./"), f"Checkpoint path must be repository-relative: {ckpt}"
              assert ckpt.endswith(".pth"), f"Unexpected checkpoint extension: {ckpt}"

          model_names = set(names)

          # Pairwise transfer tables: one ordered row for every source-target
          # combination under each attack.
          for transfer_path in (
              pathlib.Path("analysis/data/transfer_results_aa_th_aware.csv"),
              pathlib.Path("analysis/data/transfer_results_cw_eot_th_aware.csv"),
          ):
              with transfer_path.open(newline="", encoding="utf-8") as f:
                  transfer_rows = list(csv.DictReader(f))
              assert len(transfer_rows) == 3600, (
                  f"{transfer_path}: expected 3600 rows, found {len(transfer_rows)}"
              )
              targets = {row["target_model"] for row in transfer_rows}
              assert targets == model_names, (
                  f"{transfer_path}: target model set differs from 60-model manifest"
              )

          # Clean-evaluation table must cover all 60 trained detectors.
          with pathlib.Path("analysis/data/all_model_results.csv").open(
              newline="", encoding="utf-8"
          ) as f:
              clean_rows = list(csv.DictReader(f))
          assert len({row["model_name"] for row in clean_rows}) == 60

          # Aggregate oracle tables contain one row per target detector.
          for oracle_path in pathlib.Path("analysis/data").glob("*_oracle.csv"):
              with oracle_path.open(newline="", encoding="utf-8") as f:
                  oracle_rows = list(csv.DictReader(f))
              assert len(oracle_rows) == 60, (
                  f"{oracle_path}: expected 60 target rows, found {len(oracle_rows)}"
              )
              assert {row["target_model"] for row in oracle_rows} == model_names

          # Release structure expected by the training configurations.
          assert len(list(pathlib.Path("training/config/detector").glob("*.yaml"))) == 12
          assert len(list(pathlib.Path("training/config/exp").glob("train_*_ff.json"))) == 5
          assert len(list(pathlib.Path("preprocessing/dataset_json").glob("*.json"))) == 22

          # Fixed attack subset.
          with pathlib.Path("preprocessing/attack_manifest_2000.csv").open(
              newline="", encoding="utf-8"
          ) as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 2000, f"Expected 2000 attack samples, found {len(rows)}"
          assert len({r["sample_id"] for r in rows}) == 2000, "Duplicate sample_id values"
          assert len({r["frame_path"] for r in rows}) == 2000, "Duplicate frame_path values"
          assert {r["family"] for r in rows} == {"FS", "FR", "FE", "EFS"}
          family_counts = {}
          for row in rows:
              family_counts[row["family"]] = family_counts.get(row["family"], 0) + 1
          assert family_counts == {"FS": 500, "FR": 500, "FE": 500, "EFS": 500}
          assert all(r["frame_path"].startswith("datasets/") for r in rows)

          # No checkpoint binaries, raw datasets, or GitHub-rejected large files
          # should be tracked in Git.
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]

          forbidden_binary_suffixes = (".pth", ".pt", ".ckpt")
          tracked_binaries = [p for p in tracked if p.endswith(forbidden_binary_suffixes)]
          assert not tracked_binaries, f"Tracked model binaries: {tracked_binaries}"

          tracked_dataset_files = [
              p for p in tracked
              if p.startswith("datasets/") and p != "datasets/readme.md"
          ]
          assert not tracked_dataset_files, (
              f"Raw/local dataset files are tracked: {tracked_dataset_files[:20]}"
          )

          too_large = [
              p for p in tracked
              if pathlib.Path(p).is_file()
              and pathlib.Path(p).stat().st_size >= 100 * 1024 * 1024
          ]
          assert not too_large, f"Tracked files exceed GitHub's 100 MiB limit: {too_large}"

          # Public-release hygiene: no machine-specific absolute roots or review-only markers.
          patterns = [
              re.compile(r"C:" + r"\\Users\\", re.I),
              re.compile("/ho" + "me/", re.I),
              re.compile("/na" + "s-", re.I),
              re.compile("anony" + "mous", re.I),
              re.compile("NOTICE_FOR_" + "REVIEW", re.I),
              re.compile("double-" + "blind", re.I),
          ]
          violations = []
          text_suffixes = {
              ".py", ".md", ".txt", ".json", ".yaml", ".yml", ".csv", ".sh", ".tex", ".cff"
          }
          for name in tracked:
              if not name:
                  continue
              path = pathlib.Path(name)
              if path.suffix.lower() not in text_suffixes and path.name not in {"LICENSE"}:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for pattern in patterns:
                  if pattern.search(content):
                      violations.append((name, pattern.pattern))
          assert not violations, f"Release-hygiene violations: {violations[:20]}"

          print("Release metadata and manifests: PASS")
          PY


  analysis-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up modern analysis Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-analysis.txt

      - name: Execute analysis notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            analysis/analysis_fr_and_base.ipynb \
            --ExecutePreprocessor.timeout=-1

      - name: Check analysis outputs for numerical equivalence
        run: |
          python - <<'PY'
          import io
          import pathlib
          import subprocess

          import numpy as np
          import pandas as pd

          roots = [
              pathlib.Path("analysis/output/statistic"),
              pathlib.Path("analysis/output/tables"),
          ]

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--", *(str(p) for p in roots)],
              text=True,
          ).splitlines()

          failures = []
          for name in changed:
              path = pathlib.Path(name)
              baseline_bytes = subprocess.check_output(["git", "show", f"HEAD:{name}"])
              current_bytes = path.read_bytes()

              if path.suffix.lower() == ".csv":
                  baseline = pd.read_csv(io.BytesIO(baseline_bytes))
                  current = pd.read_csv(io.BytesIO(current_bytes))

                  if list(baseline.columns) != list(current.columns) or baseline.shape != current.shape:
                      failures.append(f"{name}: shape/column mismatch")
                      continue

                  for column in baseline.columns:
                      a = baseline[column]
                      b = current[column]

                      if pd.api.types.is_numeric_dtype(a) and pd.api.types.is_numeric_dtype(b):
                          av = pd.to_numeric(a, errors="coerce").to_numpy(dtype=float)
                          bv = pd.to_numeric(b, errors="coerce").to_numpy(dtype=float)
                          if not np.allclose(av, bv, rtol=1e-12, atol=1e-15, equal_nan=True):
                              failures.append(f"{name}: numeric drift in column {column}")
                      else:
                          av = a.fillna("<NA>").astype(str).to_numpy()
                          bv = b.fillna("<NA>").astype(str).to_numpy()
                          if not np.array_equal(av, bv):
                              failures.append(f"{name}: value drift in column {column}")
              else:
                  if baseline_bytes != current_bytes:
                      failures.append(f"{name}: non-CSV output changed")

          if failures:
              raise SystemExit("\n".join(failures))

          print(
              "Analysis outputs: PASS "
              f"({len(changed)} regenerated files changed only within accepted numerical tolerance)"
          )
          PY
