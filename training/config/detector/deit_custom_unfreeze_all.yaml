# ---------------------------------------
# LOGGING
# ---------------------------------------
log_dir: ./logs/testing_bench

# ---------------------------------------
# MODEL
# ---------------------------------------
model_name: deit_detector_custom

# backbone
backbone_model: deit_small_patch16_224
checkpoint_path: ./training/pretrained/deit_small_patch16_224-cd65a155.pth

img_size: 224
in_chans: 3

# classifier head
classifier_hidden_dim: 256
classifier_dropout: 0.2

# ---------------------------------------
# DATASET
# ---------------------------------------
compression: c23
train_batchSize: 128
test_batchSize: 128
workers: 8

frame_num:
  train: 1
  val: 1
  test: 1

# DeiT expects 224
resolution: 224

with_mask: false
with_landmark: false

# ---------------------------------------
# DATA AUGMENTATION
# ---------------------------------------
use_data_augmentation: true

data_aug:
  flip_prob: 0.5
  rotate_prob: 0.0
  rotate_limit: [-10, 10]

  blur_prob: 0.5
  blur_limit: [3, 7]

  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]

  contrast_limit: [-0.1, 0.1]

  quality_lower: 40
  quality_upper: 100

# ---------------------------------------
# NORMALIZATION
# ---------------------------------------
# standard ImageNet normalization for DeiT
mean: [0.485, 0.456, 0.406]
std:  [0.229, 0.224, 0.225]

# ---------------------------------------
# OPTIMIZER
# ---------------------------------------
optimizer:
  type: adam

  adam:
    lr: 0.0001

    backbone_lr: 0.00001
    head_lr: 0.0001

    beta1: 0.9
    beta2: 0.999

    eps: 0.00000001
    weight_decay: 0.001

    amsgrad: false

# ---------------------------------------
# LR SCHEDULER
# ---------------------------------------
lr_scheduler: cosine

lr_T_max: 50
lr_eta_min: 0.000001

# ---------------------------------------
# TRAINING
# ---------------------------------------
nEpochs: 50

start_epoch: 0
save_epoch: 1

rec_iter: 100

logdir: ./logs

manualSeed: 42

save_ckpt: true
save_feat: false

# ---------------------------------------
# LOSS / METRIC
# ---------------------------------------
loss_func: cross_entropy

losstype: null

metric_scoring: auc

# ---------------------------------------
# CUDA
# ---------------------------------------
cuda: true
cudnn: true