# log dir 
log_dir: ./logs/testing_bench

# model setting
pretrained: ./training/pretrained/xception_bupt_balancedface_fr_random_224_bs256_lr0005_m03/backbone_only_compatible.pth   # path to a pre-trained model, if using one
model_name: xception   # model name
backbone_name: xception  # backbone name

#backbone setting
backbone_config:
  mode: original
  num_classes: 2
  inc: 3
  dropout: false

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV, BFD_real_no_allign_bin]
train_dataset: [FaceForensics++, DF40_train_bin, DF40_eval_bin, FFpp_real_bin, BFD_real_bin, DF40_eval_bin_clean, BFD_real_no_allign_bin]
test_dataset: [FaceForensics++, DeepFakeDetection, DF40_eval_bin, DF40_eval_bin_clean, BFD_real_no_allign_bin]

compression: c23  # compression-level for videos
train_batchSize: 128
test_batchSize: 256
workers: 8   # number of data loading workers
frame_num: {'train': 1, 'val': 1, 'test': 1}   # number of frames to use per video in training and testing
resolution: 224   # resolution of output image to network
with_mask: false   # whether to include mask information in the input
with_landmark: false   # whether to include facial landmark information in the input


# data augmentation
use_data_augmentation: true  # Add this flag to enable/disable data augmentation
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.0
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100


# mean and std for normalization
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]

# ---------------------------------------
# OPTIMIZER
# ---------------------------------------
optimizer:
  type: adamw
  adamw:
    lr: 0.001   
    backbone_lr: 0.00014665179875026043    
    head_lr: 0.00014880246464134262   
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001 
    weight_decay: 0.0011654922929897542
    amsgrad: false
# ---------------------------------------
# LR SCHEDULER
# ---------------------------------------
lr_scheduler: cosine
lr_T_max: 50
lr_eta_min: 0.000001

# ---------------------------------------
# TRAINING
# ---------------------------------------
nEpochs: 50
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./saved_models_fr_pretrain
manualSeed: 42
save_ckpt: true
save_feat: false

# ---------------------------------------
# LOSS / METRIC
# ---------------------------------------
loss_func: cross_entropy
losstype: null
metric_scoring: auc

# ---------------------------------------
# CUDA
# ---------------------------------------
cuda: true
cudnn: true
